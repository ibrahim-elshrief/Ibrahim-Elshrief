<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          // 1. Intercept Vite HMR WebSocket so it never fails or throws unhandled rejections
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              var protoStr = String(protocols || '');
              if (protoStr.indexOf('vite') !== -1 || urlStr.indexOf('/@vite') !== -1 || urlStr.indexOf('hmr') !== -1 || protoStr === 'vite-hmr') {
                var noop = function() {};
                var handlers = {};
                var dummySocket = {
                  readyState: 1, // OPEN to satisfy client
                  url: urlStr,
                  protocol: protoStr,
                  close: function() {
                    dummySocket.readyState = 3;
                    if (dummySocket.onclose) dummySocket.onclose({ wasClean: true });
                  },
                  send: noop,
                  addEventListener: function(type, fn) {
                    if (!handlers[type]) handlers[type] = [];
                    handlers[type].push(fn);
                    if (type === 'open') {
                      setTimeout(function() { fn({ type: 'open' }); }, 10);
                    }
                  },
                  removeEventListener: function(type, fn) {
                    if (handlers[type]) {
                      handlers[type] = handlers[type].filter(function(f) { return f !== fn; });
                    }
                  },
                  dispatchEvent: function() { return true; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null
                };
                setTimeout(function() {
                  if (dummySocket.onopen) dummySocket.onopen({ type: 'open' });
                }, 10);
                return dummySocket;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
          }

          // 2. Suppress [vite] and WebSocket error messages in console
          var origError = console.error;
          console.error = function() {
            var full = '';
            for (var i = 0; i < arguments.length; i++) {
              full += ' ' + String((arguments[i] && (arguments[i].message || arguments[i].reason || arguments[i])) || '');
            }
            if (full.toLowerCase().indexOf('websocket') !== -1 || full.indexOf('[vite]') !== -1) {
              return;
            }
            origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            var full = '';
            for (var i = 0; i < arguments.length; i++) {
              full += ' ' + String((arguments[i] && (arguments[i].message || arguments[i].reason || arguments[i])) || '');
            }
            if (full.toLowerCase().indexOf('websocket') !== -1 || full.indexOf('[vite]') !== -1) {
              return;
            }
            origWarn.apply(console, arguments);
          };

          // 3. Catch all unhandled promise rejections related to WebSocket
          window.addEventListener('unhandledrejection', function(event) {
            var r = event.reason;
            var str = String((r && (r.message || r.reason || r.code || r)) || '');
            if (str.toLowerCase().indexOf('websocket') !== -1 || str.toLowerCase().indexOf('closed without opened') !== -1 || (r && r.target && String(r.target).indexOf('WebSocket') !== -1)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msg = String(event.message || (event.error && event.error.message) || '');
            if (msg.toLowerCase().indexOf('websocket') !== -1 || msg.toLowerCase().indexOf('closed without opened') !== -1 || (event.target && String(event.target).indexOf('WebSocket') !== -1)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }, true);

          // Clear stale cached data to prevent old or corrupted data from lingering
          localStorage.removeItem('cached_site_settings');
          localStorage.removeItem('app_direct_messages_sync');

          var saved = localStorage.getItem('site_theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          
          var lang = localStorage.getItem('site_lang') || 'ar';
          document.title = lang === 'en' ? 'Ibrahim Elshrief | إبراهيم الشريف' : 'إبراهيم الشريف | Ibrahim Elshrief';
        } catch(e) {}
      })();
    </script>
    <title>إبراهيم الشريف | Ibrahim Elshrief</title>
    <meta name="description" content="منصة إبراهيم الشريف - أعمال وبحوث، متجر رقمي، ومقالات حصرية | Ibrahim Elshrief" />
    <meta property="og:title" content="إبراهيم الشريف | Ibrahim Elshrief" />
    <meta property="og:description" content="منصة إبراهيم الشريف - أعمال وبحوث، متجر رقمي، ومقالات حصرية | Ibrahim Elshrief" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310b981'/><text x='50%' y='55%' text-anchor='middle' dominant-baseline='middle' fill='white' font-size='56' font-family='sans-serif' font-weight='800'>⚡</text></svg>" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310b981'/><text x='50%' y='55%' text-anchor='middle' dominant-baseline='middle' fill='white' font-size='56' font-family='sans-serif' font-weight='800'>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #app-zero-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Cairo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        z-index: 999999;
      }
      .dark #app-zero-loader {
        background-color: #020617;
        color: #f8fafc;
      }
      .loader-pulse-ring {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
      }
      .loader-pulse-ring::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 1.25rem;
        background: rgba(16, 185, 129, 0.18);
        animation: pulseRing 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      }
      .loader-emblem {
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 1rem;
        background: linear-gradient(135deg, #10b981, #0d9488);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 1.25rem;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      }
      .loader-bar-track {
        width: 180px;
        height: 5px;
        border-radius: 9999px;
        background: rgba(148, 163, 184, 0.25);
        overflow: hidden;
        position: relative;
        margin-top: 1rem;
      }
      .loader-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #10b981, #14b8a6, #10b981);
        animation: loaderSlide 1.4s ease-in-out infinite;
      }
      .loader-caption {
        font-size: 0.82rem;
        color: #64748b;
        margin-top: 0.75rem;
        font-weight: 600;
      }
      .dark .loader-caption {
        color: #94a3b8;
      }
      @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0; }
        100% { transform: scale(0.9); opacity: 0; }
      }
      @keyframes loaderSlide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white dark:bg-slate-950 dark:text-slate-100">
    <div id="root">
      <div id="app-zero-loader">
        <div class="loader-pulse-ring">
          <div class="loader-emblem">⚡</div>
        </div>
        <div id="loader-title" style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em;">إبراهيم الشريف</div>
        <div class="loader-bar-track">
          <div class="loader-bar-fill"></div>
        </div>
        <div class="loader-caption" id="loader-status">جاري تشغيل المنصة...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
